<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文學習 — 五十音與基礎單字</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg1: #1e2d3d;
        --bg2: #2c3e50;
        --bg3: #34495e;
        --card: rgba(255,255,255,0.07);
        --card-border: rgba(255,255,255,0.13);
        --text: #ecf0f1;
        --text-dim: #b0bec5;
        --text-faint: #78909c;
        --accent: #ef9a9a;
        --accent-strong: #e57373;
        --ok: #81c784;
        --bad: #e57373;
    }

    body {
        background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
        min-height: 100vh;
        font-family: Arial, "Microsoft JhengHei", "Hiragino Sans", "Yu Gothic", sans-serif;
        color: var(--text);
        padding: 28px 14px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header { text-align: center; margin-bottom: 22px; }
    header h1 { font-size: 2rem; letter-spacing: 3px; text-shadow: 0 2px 16px rgba(0,0,0,0.5); }
    header p { color: var(--text-dim); margin-top: 6px; font-size: 0.95rem; letter-spacing: 1px; }

    .container { width: 100%; max-width: 860px; }

    /* ===== 分頁 ===== */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
    .tab-btn {
        background: var(--card);
        border: 1px solid var(--card-border);
        color: var(--text-dim);
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.13); }
    .tab-btn.active { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: bold; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card-box {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    .hint { color: var(--text-faint); font-size: 0.85rem; margin-top: 8px; line-height: 1.6; }

    /* ===== 控制列 ===== */
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .ctrl-row .label { color: var(--text-dim); font-size: 0.9rem; margin-right: 2px; }
    .opt-btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--card-border);
        color: var(--text-dim);
        border-radius: 8px;
        padding: 7px 13px;
        font-size: 0.9rem;
        cursor: pointer;
    }
    .opt-btn.active { background: rgba(239,154,154,0.22); border-color: var(--accent); color: var(--accent); font-weight: bold; }

    .primary-btn {
        background: var(--accent-strong);
        border: none;
        color: #fff;
        border-radius: 10px;
        padding: 11px 26px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 1px;
    }
    .primary-btn:hover { filter: brightness(1.08); }
    .ghost-btn {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text-dim);
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.95rem;
        cursor: pointer;
    }

    /* ===== 五十音表 ===== */
    .kana-group-title {
        font-size: 1.05rem;
        color: var(--accent);
        margin: 18px 0 10px;
        letter-spacing: 2px;
        font-weight: bold;
    }
    .kana-grid { display: flex; flex-direction: column; gap: 6px; }
    .kana-row { display: flex; gap: 6px; align-items: stretch; }
    .kana-row-label {
        flex: 0 0 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-faint);
        font-size: 0.8rem;
    }
    .kana-cell {
        flex: 1;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 8px 2px 7px;
        text-align: center;
        cursor: pointer;
        min-width: 0;
        transition: background 0.12s, transform 0.12s;
        user-select: none;
    }
    .kana-cell:hover { background: rgba(239,154,154,0.18); transform: translateY(-2px); }
    .kana-cell.empty { visibility: hidden; cursor: default; }
    .kana-main { font-size: 1.45rem; line-height: 1.3; }
    .kana-sub { font-size: 0.95rem; color: var(--text-dim); line-height: 1.3; }
    .kana-romaji { font-size: 0.75rem; color: var(--text-faint); margin-top: 2px; }

    /* ===== 測驗 ===== */
    .quiz-stage { text-align: center; padding: 10px 0; }
    .quiz-progress { color: var(--text-faint); font-size: 0.85rem; margin-bottom: 12px; }
    .quiz-kana { font-size: 4.2rem; margin: 6px 0 18px; letter-spacing: 4px; }
    .quiz-input {
        font-size: 1.3rem;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--card-border);
        background: rgba(0,0,0,0.25);
        color: var(--text);
        text-align: center;
        width: 220px;
        max-width: 90%;
        outline: none;
    }
    .quiz-input:focus { border-color: var(--accent); }
    .quiz-feedback { min-height: 30px; margin-top: 14px; font-size: 1.05rem; }
    .quiz-feedback.ok { color: var(--ok); }
    .quiz-feedback.bad { color: var(--bad); }
    .quiz-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .result-title { font-size: 1.3rem; margin-bottom: 10px; text-align: center; }
    .result-score { font-size: 2.4rem; text-align: center; color: var(--accent); margin-bottom: 14px; }
    .wrong-list { display: flex; flex-direction: column; gap: 8px; }
    .wrong-item {
        background: rgba(229,115,115,0.12);
        border: 1px solid rgba(229,115,115,0.35);
        border-radius: 10px;
        padding: 10px 14px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
    }
    .wrong-item .w-kana { font-size: 1.5rem; }
    .wrong-item .w-ans { color: var(--ok); }
    .wrong-item .w-your { color: var(--bad); }

    .stat-line { color: var(--text-dim); font-size: 0.9rem; margin-top: 10px; line-height: 1.7; }
    .stat-line b { color: var(--accent); }

    /* ===== 單字卡 ===== */
    .flashcard {
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-align: center;
        padding: 26px 18px;
        user-select: none;
        transition: background 0.15s;
    }
    .flashcard:hover { background: rgba(255,255,255,0.1); }
    .fc-front { font-size: 2.6rem; line-height: 1.4; }
    .fc-reading { font-size: 1.4rem; color: var(--accent); margin-top: 10px; }
    .fc-romaji { font-size: 1rem; color: var(--text-faint); margin-top: 4px; }
    .fc-zh { font-size: 1.35rem; color: var(--text-dim); margin-top: 14px; }
    .fc-tap { font-size: 0.8rem; color: var(--text-faint); margin-top: 18px; letter-spacing: 1px; }
    .fc-nav { display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .fc-counter { color: var(--text-faint); font-size: 0.85rem; display: flex; align-items: center; }

    /* ===== 單字測驗選項 ===== */
    .mc-question { font-size: 1.9rem; text-align: center; margin: 8px 0 20px; line-height: 1.5; }
    .mc-question .mc-sub { display: block; font-size: 1rem; color: var(--text-faint); margin-top: 6px; }
    .mc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mc-opt {
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--card-border);
        color: var(--text);
        border-radius: 12px;
        padding: 16px 10px;
        font-size: 1.15rem;
        cursor: pointer;
        text-align: center;
        line-height: 1.5;
        transition: background 0.12s;
    }
    .mc-opt:hover { background: rgba(255,255,255,0.12); }
    .mc-opt.correct { background: rgba(129,199,132,0.25); border-color: var(--ok); }
    .mc-opt.wrong { background: rgba(229,115,115,0.25); border-color: var(--bad); }
    .mc-opt:disabled { cursor: default; }

    footer { margin-top: 34px; font-size: 0.8rem; color: #546e7a; letter-spacing: 0.5px; text-align: center; }
    footer a { color: var(--text-faint); }

    @media (max-width: 640px) {
        header h1 { font-size: 1.5rem; }
        .kana-main { font-size: 1.15rem; }
        .kana-sub { font-size: 0.8rem; }
        .kana-romaji { font-size: 0.62rem; }
        .kana-row-label { flex-basis: 30px; font-size: 0.68rem; }
        .quiz-kana { font-size: 3.2rem; }
        .mc-options { grid-template-columns: 1fr; }
        .fc-front { font-size: 2rem; }
    }
</style>
</head>
<body>
<header>
    <h1>🎌 日文學習</h1>
    <p>五十音・假名測驗・基礎單字</p>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="gojuon">五十音表</button>
        <button class="tab-btn" data-tab="kanaQuiz">假名測驗</button>
        <button class="tab-btn" data-tab="vocab">單字卡</button>
        <button class="tab-btn" data-tab="vocabQuiz">單字測驗</button>
    </div>

    <!-- ===== 五十音表 ===== -->
    <div class="panel active" id="panel-gojuon">
        <div class="card-box">
            <div class="ctrl-row">
                <span class="label">顯示：</span>
                <button class="opt-btn active" data-script="both">平假名＋片假名</button>
                <button class="opt-btn" data-script="hira">平假名</button>
                <button class="opt-btn" data-script="kata">片假名</button>
            </div>
            <div id="gojuonTable"></div>
            <div class="hint">點擊任一假名可播放發音（使用瀏覽器內建語音，需裝置支援日文語音）。</div>
        </div>
    </div>

    <!-- ===== 假名測驗 ===== -->
    <div class="panel" id="panel-kanaQuiz">
        <div class="card-box" id="kanaQuizSetup">
            <div class="ctrl-row">
                <span class="label">範圍：</span>
                <button class="opt-btn active" data-scope="seion">清音</button>
                <button class="opt-btn" data-scope="dakuon">濁音・半濁音</button>
                <button class="opt-btn" data-scope="yoon">拗音</button>
            </div>
            <div class="ctrl-row">
                <span class="label">假名：</span>
                <button class="opt-btn active" data-qscript="hira">平假名</button>
                <button class="opt-btn" data-qscript="kata">片假名</button>
                <button class="opt-btn" data-qscript="mix">混合</button>
            </div>
            <div class="ctrl-row">
                <span class="label">題數：</span>
                <button class="opt-btn active" data-qcount="10">10</button>
                <button class="opt-btn" data-qcount="20">20</button>
                <button class="opt-btn" data-qcount="all">全部</button>
            </div>
            <div style="text-align:center; margin-top: 6px;">
                <button class="primary-btn" id="startKanaQuiz">開始測驗</button>
            </div>
            <div class="hint">看假名、輸入羅馬拼音（例：か → ka）。接受常見拼法變體（shi / si、tsu / tu…）。範圍可複選。</div>
            <div class="stat-line" id="kanaStatLine"></div>
        </div>

        <div class="card-box" id="kanaQuizStage" style="display:none;">
            <div class="quiz-stage">
                <div class="quiz-progress" id="kanaQuizProgress"></div>
                <div class="quiz-kana" id="kanaQuizChar"></div>
                <input class="quiz-input" id="kanaQuizInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="羅馬拼音">
                <div class="quiz-feedback" id="kanaQuizFeedback"></div>
                <div class="quiz-actions">
                    <button class="primary-btn" id="kanaQuizSubmit">作答</button>
                    <button class="ghost-btn" id="kanaQuizQuit">結束測驗</button>
                </div>
            </div>
        </div>

        <div class="card-box" id="kanaQuizResult" style="display:none;"></div>
    </div>

    <!-- ===== 單字卡 ===== -->
    <div class="panel" id="panel-vocab">
        <div class="card-box">
            <div class="ctrl-row" id="vocabCatRow"><span class="label">分類：</span></div>
            <div class="flashcard" id="flashcard"></div>
            <div class="fc-nav">
                <button class="ghost-btn" id="fcPrev">← 上一個</button>
                <span class="fc-counter" id="fcCounter"></span>
                <button class="ghost-btn" id="fcNext">下一個 →</button>
                <button class="ghost-btn" id="fcShuffle">🔀 洗牌</button>
                <button class="ghost-btn" id="fcSpeak">🔊 發音</button>
            </div>
            <div class="hint">點擊卡片翻面顯示讀音與中文意思。</div>
        </div>
    </div>

    <!-- ===== 單字測驗 ===== -->
    <div class="panel" id="panel-vocabQuiz">
        <div class="card-box" id="vocabQuizSetup">
            <div class="ctrl-row">
                <span class="label">方向：</span>
                <button class="opt-btn active" data-vdir="j2z">日文 → 中文</button>
                <button class="opt-btn" data-vdir="z2j">中文 → 日文</button>
            </div>
            <div style="text-align:center; margin-top: 6px;">
                <button class="primary-btn" id="startVocabQuiz">開始測驗（10 題）</button>
            </div>
            <div class="hint">四選一選擇題，答錯會即時顯示正確答案。</div>
            <div class="stat-line" id="vocabStatLine"></div>
        </div>

        <div class="card-box" id="vocabQuizStage" style="display:none;">
            <div class="quiz-progress" id="vocabQuizProgress" style="text-align:center;"></div>
            <div class="mc-question" id="vocabQuizQuestion"></div>
            <div class="mc-options" id="vocabQuizOptions"></div>
        </div>

        <div class="card-box" id="vocabQuizResult" style="display:none;"></div>
    </div>
</div>

<footer>
    <a href="index.html">← 回 Voca2000 首頁</a><br><br>
    <span id="versionLabel"></span>
</footer>

   共用工具
   ============================================================ */
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function loadStats() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const o = JSON.parse(raw);
            if (o && typeof o === 'object') {
                return {
                    kanaWrong: o.kanaWrong || {},
                    kanaHistory: Array.isArray(o.kanaHistory) ? o.kanaHistory : [],
                    vocabHistory: Array.isArray(o.vocabHistory) ? o.vocabHistory : []
                };
            }
        }
    } catch (e) { /* 資料損毀時重置 */ }
    return { kanaWrong: {}, kanaHistory: [], vocabHistory: [] };
}

function saveStats() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) { /* 容量滿時忽略 */ }
}

let stats = loadStats();

let jpVoice = null;
function pickJpVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    jpVoice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => (v.lang || '').startsWith('ja')) || null;
}
if ('speechSynthesis' in window) {
    pickJpVoice();
    speechSynthesis.onvoiceschanged = pickJpVoice;
}
function speakJa(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (jpVoice) u.voice = jpVoice;
    u.rate = 0.85;
    speechSynthesis.speak(u);
}

function kanaPool() {
    const pool = [];
    for (const key of kanaScopes) {
        for (const row of KANA_GROUPS[key].rows) {
            for (const cell of row.cells) {
                if (!cell) continue;
                const script = kanaScript === 'mix' ? (Math.random() < 0.5 ? 'hira' : 'kata') : kanaScript;
                pool.push({ char: script === 'hira' ? cell[0] : cell[1], hira: cell[0], romaji: cell[2] });
            }
        }
    }
    return pool;
}

        parts.push('上次成績：<b>' + last.score + ' / ' + last.total + '</b>（共測驗 ' + stats.kanaHistory.length + ' 次）');
    }

        parts.push('常錯拼音：' + wrongEntries.map(([r, c]) => '<b>' + escapeHtml(r) + '</b>×' + c).join('、'));

    el.innerHTML = parts.join('<br>');
}

}

function romajiMatches(ans, input) {
    const v = input.trim().toLowerCase();
    if (!v) return false;
    if (v === ans) return true;
    return (ROMAJI_ALT[ans] || []).includes(v);
}

function kanaSubmit() {
    if (!kanaQuiz) return;
    if (kanaQuiz.answered) { kanaNext(); return; }
    const q = kanaQuiz.items[kanaQuiz.idx];
    const input = document.getElementById('kanaQuizInput');
    const fb = document.getElementById('kanaQuizFeedback');
    const ok = romajiMatches(q.romaji, input.value);
    kanaQuiz.answered = true;
    input.disabled = true;
    speakJa(q.hira);
    if (ok) {
        kanaQuiz.correct++;
        fb.textContent = '⭕ 正確！';
        fb.className = 'quiz-feedback ok';
    } else {
        kanaQuiz.wrong.push({ char: q.char, romaji: q.romaji, your: input.value.trim() });
        stats.kanaWrong[q.romaji] = (stats.kanaWrong[q.romaji] || 0) + 1;
        fb.textContent = '❌ 正確答案：' + q.romaji + (input.value.trim() ? '（你的答案：' + input.value.trim() + '）' : '');
        fb.className = 'quiz-feedback bad';
    }
    document.getElementById('kanaQuizSubmit').textContent =
        kanaQuiz.idx + 1 >= kanaQuiz.items.length ? '看結果' : '下一題';
    document.getElementById('kanaQuizSubmit').focus();
}

function kanaNext() {
    kanaQuiz.idx++;
    if (kanaQuiz.idx >= kanaQuiz.items.length) { finishKanaQuiz(); return; }
    renderKanaQuestion();
}

function finishKanaQuiz() {
    const total = kanaQuiz.items.length;
    stats.kanaHistory.push({ t: Date.now(), score: kanaQuiz.correct, total });
    if (stats.kanaHistory.length > 50) stats.kanaHistory = stats.kanaHistory.slice(-50);
    saveStats();
    renderKanaStatLine();

    let html = '<div class="result-title">測驗結束</div>'
        + '<div class="result-score">' + kanaQuiz.correct + ' / ' + total + '</div>';
    if (kanaQuiz.wrong.length) {
        html += '<div class="wrong-list">' + kanaQuiz.wrong.map(w =>
            '<div class="wrong-item"><span class="w-kana">' + w.char + '</span>'
            + '<span class="w-ans">正解：' + escapeHtml(w.romaji) + '</span>'
            + (w.your ? '<span class="w-your">你的答案：' + escapeHtml(w.your) + '</span>' : '<span class="w-your">未作答</span>')
            + '</div>').join('') + '</div>';
    } else {
        html += '<div style="text-align:center; color: var(--ok);">全部答對，太棒了！🎉</div>';
    }
    html += '<div class="quiz-actions"><button class="primary-btn" id="kanaQuizAgain">再測一次</button></div>';
    const box = document.getElementById('kanaQuizResult');
    box.innerHTML = html;
    box.style.display = '';
    document.getElementById('kanaQuizStage').style.display = 'none';
    document.getElementById('kanaQuizSetup').style.display = '';
    document.getElementById('kanaQuizAgain').addEventListener('click', () => {
        document.getElementById('startKanaQuiz').click();
    });
    kanaQuiz = null;
}

function vocabJpLabel(w) {
    return escapeHtml(w.jp) + (w.kana ? '<span class="mc-sub">' + escapeHtml(w.kana) + '</span>' : '');
}

function renderVocabQuestion() {
    const w = vocabQuiz.items[vocabQuiz.idx];
    document.getElementById('vocabQuizProgress').textContent =
        '第 ' + (vocabQuiz.idx + 1) + ' / ' + vocabQuiz.items.length + ' 題　答對 ' + vocabQuiz.correct;

    const qEl = document.getElementById('vocabQuizQuestion');
    qEl.innerHTML = vocabDir === 'j2z' ? vocabJpLabel(w) : escapeHtml(w.zh);

    // 干擾選項：同分類優先，不足補其他
    const others = shuffle(VOCAB.filter(v => v !== w));
    others.sort((a, b) => (a.cat === w.cat ? 0 : 1) - (b.cat === w.cat ? 0 : 1));
    const options = shuffle([w, ...others.slice(0, 3)]);

    const optWrap = document.getElementById('vocabQuizOptions');
    optWrap.innerHTML = '';
    const btnMap = new Map();
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'mc-opt';
        btn.innerHTML = vocabDir === 'j2z' ? escapeHtml(opt.zh) : vocabJpLabel(opt);
        btn.addEventListener('click', () => answerVocab(opt, w, btn, optWrap, btnMap));
        btnMap.set(opt, btn);
        optWrap.appendChild(btn);
    });
}

function answerVocab(chosen, correct, btn, optWrap, btnMap) {
    if (vocabQuiz.answered) return;
    vocabQuiz.answered = true;
    optWrap.querySelectorAll('.mc-opt').forEach(b => { b.disabled = true; });
    speakJa(correct.kana || correct.jp);
    if (chosen === correct) {
        vocabQuiz.correct++;
        btn.classList.add('correct');
    } else {
        btn.classList.add('wrong');
        const correctText = vocabDir === 'j2z' ? correct.zh : (correct.jp + (correct.kana ? '（' + correct.kana + '）' : ''));
        const chosenText = vocabDir === 'j2z' ? chosen.zh : (chosen.jp + (chosen.kana ? '（' + chosen.kana + '）' : ''));
        vocabQuiz.wrong.push({ word: correct, yourText: chosenText, correctText });
        const correctBtn = btnMap.get(correct);
        if (correctBtn) correctBtn.classList.add('correct');
    }
    setTimeout(() => {
        vocabQuiz.answered = false;
        vocabQuiz.idx++;
        if (vocabQuiz.idx >= vocabQuiz.items.length) finishVocabQuiz();
        else renderVocabQuestion();
    }, chosen === correct ? 700 : 1600);
}

function finishVocabQuiz() {
    const total = vocabQuiz.items.length;
    stats.vocabHistory.push({ t: Date.now(), score: vocabQuiz.correct, total });
    if (stats.vocabHistory.length > 50) stats.vocabHistory = stats.vocabHistory.slice(-50);
    saveStats();
    renderVocabStatLine();

    let html = '<div class="result-title">測驗結束</div>'
        + '<div class="result-score">' + vocabQuiz.correct + ' / ' + total + '</div>';
    if (vocabQuiz.wrong.length) {
        html += '<div class="wrong-list">' + vocabQuiz.wrong.map(w =>
            '<div class="wrong-item"><span class="w-kana">' + escapeHtml(w.word.jp) + '</span>'
            + '<span class="w-ans">正解：' + escapeHtml(w.correctText) + '</span>'
            + '<span class="w-your">你的答案：' + escapeHtml(w.yourText) + '</span>'
            + '</div>').join('') + '</div>';
    } else {
        html += '<div style="text-align:center; color: var(--ok);">全部答對，太棒了！🎉</div>';
    }
    html += '<div class="quiz-actions"><button class="primary-btn" id="vocabQuizAgain">再測一次</button></div>';
    const box = document.getElementById('vocabQuizResult');
    box.innerHTML = html;
    box.style.display = '';
    document.getElementById('vocabQuizStage').style.display = 'none';
    document.getElementById('vocabQuizSetup').style.display = '';
    document.getElementById('vocabQuizAgain').addEventListener('click', () => {
        document.getElementById('startVocabQuiz').click();
    });
    vocabQuiz = null;
}
</script>
</body>
</html>
